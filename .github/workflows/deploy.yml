name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Run tests ────────────────────────────────────────
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Create dummy model for CI
        run: |
          python - << 'EOF'
          import os, joblib, numpy as np
          from sklearn.svm import LinearSVC
          from sklearn.calibration import CalibratedClassifierCV
          from sklearn.feature_extraction.text import TfidfVectorizer

          texts  = [
              "great movie loved it brilliant masterpiece",
              "terrible awful boring waste hated it",
              "wonderful amazing fantastic superb outstanding",
              "horrible disgusting dreadful pathetic garbage",
              "excellent perfect beautiful stunning incredible",
              "dull tedious pointless confusing disappointing"
          ]
          labels = [1, 0, 1, 0, 1, 0]

          vec = TfidfVectorizer()
          X   = vec.fit_transform(texts)

          base = LinearSVC(C=1.0, max_iter=1000, random_state=42)
          base.fit(X, labels)

          cal = CalibratedClassifierCV(base, cv='prefit')
          cal.fit(X, labels)

          os.makedirs('artifacts', exist_ok=True)
          joblib.dump(cal, 'artifacts/svm_best_model.pkl')
          joblib.dump(vec, 'artifacts/tfidf_vectorizer.pkl')
          print("CI dummy model created successfully")
          EOF
      - name: Download NLTK data
        run: |
          python -c "
          import nltk
          nltk.download('stopwords', quiet=True)
          nltk.download('punkt', quiet=True)
          nltk.download('punkt_tab', quiet=True)
          nltk.download('wordnet', quiet=True)
          "

      - name: Run tests
        run: |
          cd $GITHUB_WORKSPACE
          python -m pytest tests/ -v --tb=short

  # ── Job 2: Build Docker image ───────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test          # only runs if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sentiment_api .

      - name: Verify image starts correctly
        run: |
          docker run -d -p 8000:8000 --name test-container sentiment_api
          sleep 15
          curl -f http://localhost:8000/health
          docker stop test-container

  # ── Job 3: Deploy to Render ─────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]   # only runs if both test and build pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set. Skipping deployment."
            exit 0
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK" \
               -H "Content-Type: application/json"